[package]
name = "topal-core"
description = "File encryption format and streaming cipher for Topal"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
argon2 = "0.5"
bip39 = "2"
chacha20poly1305 = { version = "0.10", features = ["stream"] }
hkdf = "0.12"
rand = "0.8"
rayon = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "1"
walkdir = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"
