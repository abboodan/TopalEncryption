[package]
name = "topal-android"
description = "Bridge between topal-core and the Topal Encryption Android app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "topal_android"
# `cdylib` is what the app loads; `rlib` lets `cargo test` link the tests on any host.
crate-type = ["cdylib", "rlib"]

[dependencies]
topal-core = { path = "../../core" }
zeroize = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[dev-dependencies]
tempfile = "3"
