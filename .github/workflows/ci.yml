name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test core, CLI and the Android bridge
        run: cargo test -p topal-core -p topal -p topal-android
      - name: Check desktop app
        run: cargo check -p topal-gui
