name: Release

# Builds everything a release holds: the Windows installer, the portable app, the
# command-line tool and the Android APK.
#
# - Pushing a tag `v1.2.3` builds them and opens a DRAFT release holding the files and
#   their SHA-256. Nothing is public until the draft is published by hand.
# - "Run workflow", or a pull request that changes this file, is a dry run: the same
#   builds, kept as workflow artifacts, with no release and an unsigned APK.
#
# The signing keys are only used for a tag. They come from repository secrets:
# - the Android APK: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD;
# - the desktop app's updates: TAURI_SIGNING_PRIVATE_KEY (the content of the key file) and
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
#
# A release also holds `latest.json`, which the installed desktop app reads when it checks
# for updates: the version, where its installer is, and the installer's signature. The
# Android app does not read it: it looks at the newest release and at its APK.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # SHA-256 of the certificate every released APK must be signed with. Android only
  # installs an update signed with the same key as the app it replaces.
  ANDROID_CERT_SHA256: 9f84c026aab65ee0e40fe233e64c7d27069a56a61be394eb5d1f82e2175ebe93

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read the version, and check the tag against it
        id: version
        run: |
          version=$(grep -m1 -oP '^version\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::No version found in Cargo.toml"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
          tauri=$(grep -m1 -oP '"version"\s*:\s*"\K[^"]+' gui/src-tauri/tauri.conf.json)
          if [ "$tauri" != "$version" ]; then
            echo "::error::gui/src-tauri/tauri.conf.json says $tauri, Cargo.toml says $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: prepare
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Test
        run: cargo test --locked -p topal-core -p topal -p topal-gui
      - name: Build the command-line tool
        run: cargo build --release --locked -p topal
      - name: Build the app and its installer
        working-directory: gui
        shell: bash
        env:
          # Only a tag gets the key that signs updates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          npm ci
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
              echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set, so the update cannot be signed."
              exit 1
            fi
            npx tauri build
          else
            # Dry run: the same build, without the update signature and without the key.
            npx tauri build --config src-tauri/dry-run.conf.json
          fi
      - name: Collect the files
        shell: bash
        run: |
          mkdir dist
          cp target/release/topal-cli.exe target/release/TopalEncryption.exe dist/
          cp "target/release/bundle/nsis/Topal Encryption_${VERSION}_x64-setup.exe" \
             "dist/TopalEncryption_${VERSION}_x64-setup.exe"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # What the installed app reads to find this version: see the top of this file.
            sig=$(tr -d '\r\n' < "target/release/bundle/nsis/Topal Encryption_${VERSION}_x64-setup.exe.sig")
            if [ -z "$sig" ]; then
              echo "::error::The installer has no update signature."
              exit 1
            fi
            # The signature must be made with the key whose public half is built into the
            # app, or no installed copy would accept the update. Both name their key by ID.
            key_id() { base64 --decode | sed -n 2p | base64 --decode | head -c 10 | tail -c 8 | od -An -tx1 | tr -d ' \n'; }
            built_in=$(sed -n 's/.*"pubkey"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' gui/src-tauri/tauri.conf.json | head -n 1 | key_id)
            signed_with=$(printf '%s' "$sig" | key_id)
            if [ -z "$built_in" ] || [ "$signed_with" != "$built_in" ]; then
              echo "::error::The update is not signed with the key built into the app."
              exit 1
            fi
            {
              echo '{'
              echo "  \"version\": \"${VERSION}\","
              echo "  \"pub_date\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\","
              echo '  "platforms": {'
              echo '    "windows-x86_64": {'
              echo "      \"signature\": \"${sig}\","
              echo "      \"url\": \"https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/TopalEncryption_${VERSION}_x64-setup.exe\""
              echo '    }'
              echo '  }'
              echo '}'
            } > dist/latest.json
            cat dist/latest.json
          fi
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  android:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Rust with the Android targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Install the NDK the app asks for
        run: |
          ndk=$(grep -m1 -oP 'ndkVersion\s*=\s*"\K[^"]+' android/app/build.gradle.kts)
          if [ -z "$ndk" ]; then
            echo "::error::No ndkVersion found in android/app/build.gradle.kts"
            exit 1
          fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
          ls "$ANDROID_HOME/ndk"
      - name: Test the bridge
        run: cargo test --locked -p topal-android
      - name: Set up the signing key
        if: github.ref_type == 'tag'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::The Android signing secrets are not set, so a release APK cannot be signed."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          # A backslash starts an escape in a .properties file.
          escape() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$(escape "$KEYSTORE_PASSWORD")"
            echo "keyAlias=$(escape "$KEY_ALIAS")"
            echo "keyPassword=$(escape "$KEY_PASSWORD")"
          } > android/keystore.properties
      - name: Build the APK
        working-directory: android
        run: ./gradlew --no-daemon --console=plain :app:assembleRelease
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/keystore.properties
      - name: Collect the APK
        run: |
          mkdir dist
          out=android/app/build/outputs/apk/release
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            apk="dist/TopalEncryption_${VERSION}_android.apk"
            cp "$out/app-release.apk" "$apk"
            certs=$("$apksigner" verify --print-certs "$apk")
            echo "$certs"
            if ! echo "$certs" | grep -qi "SHA-256 digest: $ANDROID_CERT_SHA256"; then
              echo "::error::The APK is not signed with the release key."
              exit 1
            fi
          else
            cp "$out/app-release-unsigned.apk" "dist/TopalEncryption_${VERSION}_android-unsigned.apk"
          fi
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [prepare, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Open a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          {
            echo "_Write what changed in this version here, then publish._"
            echo
            echo "## Downloads"
            echo
            echo "| File | What it is |"
            echo "|---|---|"
            echo "| \`TopalEncryption_${VERSION}_x64-setup.exe\` | Installer for the desktop app, with the Explorer menu |"
            echo "| \`TopalEncryption.exe\` | Portable desktop app, no installation |"
            echo "| \`topal-cli.exe\` | Command-line tool |"
            echo "| \`TopalEncryption_${VERSION}_android.apk\` | Android app (Android 13 or later) |"
            echo "| \`latest.json\` | Read by the desktop app when it checks for updates; nothing to download |"
            echo
            echo "SHA-256:"
            echo
            echo '```'
            sha256sum -- * | sed 's/ \*/  /'
            echo '```'
            echo
            echo "The Windows builds are not code-signed, so Windows SmartScreen may warn on first launch (**More info → Run anyway**)."
            echo
            echo "Updates of the installed desktop app are signed with the project's update key; the app refuses anything else."
            echo
            echo "The APK is signed with the project's own key (certificate SHA-256 \`${ANDROID_CERT_SHA256}\`). Android asks you to allow installing apps from the browser or file manager you open it with."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Topal Encryption $VERSION" --notes-file "$RUNNER_TEMP/notes.md" -- *
